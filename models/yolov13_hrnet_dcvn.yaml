nc: 2                   # 你的类别数（原80改为2）
scales:              # 保持原样
  n: [0.50, 0.5, 1024]
  s: [0.50, 0.50, 1024]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # 替换原始第一层Conv，用HRNetBackbone提取初始特征
  - [-1, 1, HRNetBackbone, [64]]     # 0: 输入3→64通道，下采样4倍（1/4）
  # 以下保持原有backbone结构，但注意输入通道改为64（自动适配）
  - [-1, 1, Conv, [128, 3, 2, 1, 2]] # 1: 64→128, 下采样到1/8
  - [-1, 2, DSC3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2, 1, 4]] # 3: 下采样到1/16
  - [-1, 2, DSC3k2, [512, False, 0.25]]
  - [-1, 1, DSConv, [512, 3, 2]]     # 5: 下采样到1/32
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, DSConv, [1024, 3, 2]]    # 7: 下采样到1/64
  - [-1, 4, A2C2f, [1024, True, 1]]  # 8

head:
  # 原head部分保持不变，但可以在适当位置插入DCVNBlock
  # 例如：在特征融合后、检测前增强特征
  - [[4, 6, 8], 2, HyperACE, [512, 8, True, True, 0.5, 1, "both"]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [ 9, 1, DownsampleConv, []]
  - [[6, 9], 1, FullPAD_Tunnel, []]  #12
  - [[4, 10], 1, FullPAD_Tunnel, []]  #13
  - [[8, 11], 1, FullPAD_Tunnel, []]  #14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 2, DSC3k2, [512, True]]      # 17
  # 在此处插入DCVNBlock增强特征（输入输出通道不变）
  - [-1, 1, DCVNBlock, [512, 2]]      # 18: 输入512，输出512，expand_ratio=2
  - [[-1, 9], 1, FullPAD_Tunnel, []]  # 19

  - [17, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, DSC3k2, [256, True]]      # 22
  - [10, 1, Conv, [256, 1, 1]]
  - [[22, 23], 1, FullPAD_Tunnel, []] # 24

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 19], 1, Concat, [1]]        # 注意索引更新
  - [-1, 2, DSC3k2, [512, True]]      # 27
  - [[-1, 9], 1, FullPAD_Tunnel, []]

  - [27, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, DSC3k2, [1024, True]]     # 31
  - [[-1, 11], 1, FullPAD_Tunnel, []]

  - [[24, 28, 32], 1, Detect, [nc]]   # 最后的输出层索引根据上面调整，实际为24,28,32